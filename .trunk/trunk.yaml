version: 0.1
cli:
  version: 1.22.9
plugins:
  sources:
    - id: trunk
      ref: v1.6.7
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@18.20.5
    - python@3.10.8
lint:
  enabled:
    - actionlint@1.7.7
    - checkov@3.2.360
    - eslint@9.19.0
    - git-diff-check
    - markdownlint@0.44.0
    - osv-scanner@1.9.2
    - oxipng@9.1.3
    - prettier@3.4.2
    - trufflehog@3.88.4
    - yamllint@1.35.1
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
