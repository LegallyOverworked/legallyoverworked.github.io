name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Daily rebuild so the activity heatmap and live stats stay fresh.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # lets the scheduled run keep its own schedule enabled

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      # Writes a counts-only snapshot (no repo names). Never fails the build:
      # if a source is unreachable, the last deployed data is reused.
      - name: Fetch GitHub + GitLab activity stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITLAB_STATS_TOKEN: ${{ secrets.GITLAB_STATS_TOKEN }}
          STATS_BASELINE_URL: https://legallyoverworked.github.io/stats.json
        run: node scripts/fetch-stats.mjs

      # GitHub pauses schedules on public repos after 60 days without activity.
      - name: Keep the daily schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"

      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
